name: sus_travel
publish:
  - name: sus_travel
    id: 0xC
    freq_hz: 100
    signals:
      - name: sus_travel_l_pos
        slice: 0 + 16
        unit:
          type: int16_t
          name: '%' 
          offset: 0
          scale: 100/255
      - name: sus_travel_r_pos
        slice: 16 + 16
        unit:
          type: int16_t
          name: '%'
          offset: 0
          scale: 100/255
  - name: sus_travel_debug
    id: 0x6C0
    freq_hz: 100
    signals:
      - name: sus_travel_l_raw
        slice: 0 + 16
        unit:
          type: int16_t
          name: ''
          offset: 0
          scale: 1
      - name: sus_travel_r_raw
        slice: 16 + 16
        unit:
          type: int16_t
          name: ''
          offset: 0
          scale: 1
