name: sus_travel
publish:
  - name: sus_travel
    id: 0xC
    freq_hz: 100
    signals:
      - name: sus_travel_status
        slice: 0 + 8
        unit:
          type: enum
          values:
            - SUS_TRAVEL_RUN
            - SUS_TRAVEL_L_OUT_OF_RANGE
            - SUS_TRAVEL_R_OUT_OF_RANGE
            - SUS_TRAVEL_POSITION_IMPLAUSIBILITY
      - name: sus_travel_l_pos
        slice: 8 + 16
        unit:
          type: int16_t
          name: '%' 
          offset: 0
          scale: 100/255
      - name: sus_travel_r_pos
        slice: 24 + 16
        unit:
          type: int16_t
          name: '%'
          offset: 0
          scale: 100/255
  - name: sus_travel_debug
    id: 0x6C0
    freq_hz: 100
    signals:
      - name: sus_travel_l_raw
        slice: 0 + 16
        unit:
          type: int16_t
          name: ''
          offset: 0
          scale: 1
      - name: sus_travel_r_raw
        slice: 16 + 16
        unit:
          type: int16_t
          name: ''
          offset: 0
          scale: 1
      - name: sus_travel_l_out_of_range
        slice: 32 + 1
        unit:
          type: bool
          values:
            t: OUT_OF_RANGE
            f: IN_RANGE
      - name: sus_travel_r_out_of_range
        slice: 33 + 1
        unit:
          type: bool
          values:
            t: OUT_OF_RANGE
            f: IN_RANGE
