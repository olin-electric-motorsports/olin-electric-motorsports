name: bspd
publish:
  - name: bspd
    id: 0xb
    freq_hz: 100
    signals:

      # Original Brake Pressure Data
      # not sure what the scale is here yet, so going to leave this as - is
      # Will be worked on; will look at datasheet
      - name: brake_pressure
        slice: 0 + 16
        unit:
          type: uint16_t
          name: PSI
          offset: -1.25
          scale: 25 * (5 / 4096)

      # Filtered Brake Pressure Data
      # not sure what the scale is here yet, so going to leave this as - is
      # Will be worked on; will look at datasheet
      - name: brake_pressure_filtered
        slice: 16 + 16
        unit:
          type: uint16_t
          name: PSI
          offset: -1.25
          scale: 25 * (5 / 4096)
    
      # Shutdown Sense/BSPD Status
      - name: ss_bspd
        slice: 32 + 1
        unit:
          type: bool
          values:
            t: CLOSED/NRM. CND.
            f: OPEN/FAULT

      # Heartbeat Status
      # "lub-DUB" chosen because that is how an actual heartbeat sounds like. Link: https://www.nhlbi.nih.gov/health/heart/heart-beats
      - name: heartbeat
        slice: 33 + 1
        unit:
          type: bool
          values:
            t: lub
            f: DUB

      # Brake Light Status
      - name: brake_gate
        slice: 34 + 1
        unit:
          type: bool
          values:
            t: Brake Light ON
            f: Brake Light OFF

      # Motor Current Status
      - name: bspd_5kw
        slice: 35 + 1
        unit:
          type: bool
          values:
            t: BSPD Power Over 5kW
            f: BSPD Power Under 5kW