name: wheel_speed
publish:
  - name: wheel_speed
    id: 0x470
    freq_hz: 100
    signals:
      - name: wheel_speed_l
        slice: 0 + 16
        unit:
          type: int16_t
          name: ''
          offset: 0
          scale: 1
      - name: wheel_speed_r
        slice: 16 + 16
        unit:
          type: int16_t
          name: ''
          offset: 0
          scale: 1
      # Heartbeat Status
      # "lub-DUB" chosen because that is how an actual heartbeat sounds like. Link: https://www.nhlbi.nih.gov/health/heart/heart-beats
      - name: heartbeat
        slice: 32 + 1
        unit:
          type: bool
          values:
            t: lub
            f: DUB